name: Build & Release (Android APK, iOS IPA, npm Package)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: ''
      publish_npm:
        description: 'Publish package to npm registry (requires NPM_TOKEN secret)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            IS_TAG="true"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
            IS_TAG="true"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            TAG="v${PKG_VER}"
            IS_TAG="false"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"

  build-npm-package:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install all build and runtime dependencies
        run: npm install && node scripts/link-workspaces.mjs

      - name: Set package version
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Execute npm run build and run verification tests
        run: |
          npm run check
          npm run build
          node --import tsx --test tests/admin-draft.test.ts tests/analytics-search.test.ts tests/atelier-adapter.test.ts tests/backup.test.ts tests/build-output.test.ts tests/collection-mapping-poc.test.ts tests/content-v2-contract.test.ts tests/projects-route.test.ts tests/pwa.test.ts tests/site-setup.test.ts tests/store.test.ts tests/theme-settings.test.ts

      - name: Pack npm tarball
        run: |
          mkdir -p release-artifacts
          rm -f astro-static-studio-*.tgz
          npm pack
          TARBALL=$(ls -t astro-static-studio-*.tgz | head -n 1)
          test -f "$TARBALL"
          mv "$TARBALL" "release-artifacts/astro-static-studio-${{ needs.prepare.outputs.version }}.tgz"

      - name: Publish to npm registry (when NPM_TOKEN secret is set)
        if: ${{ needs.prepare.outputs.is_tag == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm) }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public
          else
            echo "Skipping npm publish because NPM_TOKEN secret is not configured."
          fi

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release-artifacts/*.tgz

  build-android-apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & install required platform/build-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies & run full offline build (npm run build)
        run: |
          npm install
          node scripts/link-workspaces.mjs
          npm run build
          node scripts/generate-mobile-assets.mjs

      - name: Sync offline bundle to Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html
          chmod +x android/gradlew

      - name: Package Android APK (astro-static-studio.apk)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file=app/release.keystore \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
            APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            ./gradlew assembleDebug --no-daemon
            APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          test -n "$APK_FILE" && test -f "$APK_FILE"
          cp "$APK_FILE" "../release-artifacts/astro-static-studio.apk"
          ls -lh ../release-artifacts/astro-static-studio.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/astro-static-studio.apk

  build-ios-app:
    needs: prepare
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & run full offline build (npm run build)
        run: |
          npm install
          node scripts/link-workspaces.mjs
          npm run build
          node scripts/generate-mobile-assets.mjs

      - name: Sync offline bundle to Capacitor iOS project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
          test -f ios/App/App/public/index.html

      - name: Resolve Capacitor iOS Swift Package dependencies
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Archive & package iOS IPA artifact
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          mkdir -p release-artifacts/ios-build/Payload
          cd ios/App

          if [ -n "$IOS_CERTIFICATE_BASE64" ] && [ -n "$IOS_PROVISION_PROFILE_BASE64" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASS="ci-temp-keychain"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/ci.mobileprovision

            xcodebuild archive \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath "$GITHUB_WORKSPACE/release-artifacts/App.xcarchive" \
              MARKETING_VERSION="${{ needs.prepare.outputs.version }}"

            echo "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"
            xcodebuild -exportArchive \
              -archivePath "$GITHUB_WORKSPACE/release-artifacts/App.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$GITHUB_WORKSPACE/release-artifacts/ios-signed"
            IPA_FILE=$(find "$GITHUB_WORKSPACE/release-artifacts/ios-signed" -name "*.ipa" | head -n 1)
            cp "$IPA_FILE" "$GITHUB_WORKSPACE/release-artifacts/astro-static-studio.ipa"
          else
            xcodebuild archive \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath "$GITHUB_WORKSPACE/release-artifacts/App.xcarchive" \
              MARKETING_VERSION="${{ needs.prepare.outputs.version }}" \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

            test -d "$GITHUB_WORKSPACE/release-artifacts/App.xcarchive/Products/Applications/App.app"
            cp -R "$GITHUB_WORKSPACE/release-artifacts/App.xcarchive/Products/Applications/App.app" "$GITHUB_WORKSPACE/release-artifacts/ios-build/Payload/"
            cd "$GITHUB_WORKSPACE/release-artifacts/ios-build"
            zip -r "$GITHUB_WORKSPACE/release-artifacts/astro-static-studio-unsigned.ipa" Payload
          fi

          cd "$GITHUB_WORKSPACE/release-artifacts"
          zip -r "astro-static-studio.xcarchive.zip" App.xcarchive
          rm -rf App.xcarchive ios-build ios-signed

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: |
            release-artifacts/*.ipa
            release-artifacts/*.xcarchive.zip

  publish-github-release:
    needs: [prepare, build-npm-package, build-android-apk, build-ios-app]
    if: ${{ !cancelled() && (needs.build-android-apk.result == 'success' || needs.build-npm-package.result == 'success' || needs.build-ios-app.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          mkdir -p all-artifacts
          cd all-artifacts
          if compgen -G "*" > /dev/null; then
            sha256sum * > SHA256SUMS.txt
          fi
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Astro Static Studio ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: all-artifacts/*
          body: |
            ### خروجی‌های رسمی Astro Static Studio (${{ needs.prepare.outputs.tag }})

            - **Android (`astro-static-studio.apk`)**: اپلیکیشن مستقل ۱۰۰٪ آفلاین (ساخته‌شده با `npm run build` + Capacitor).
            - **iOS (`astro-static-studio*.ipa` و `astro-static-studio.xcarchive.zip`)**: خروجی مستقل iOS آمادهٔ امضا و نصب.
            - **Node / npm (`.tgz`)**: بستهٔ قابل نصب روی **Windows / macOS / Linux**:
              ```bash
              npx astro-static-studio
              # یا نصب سراسری:
              npm install -g astro-static-studio && astro-studio
              ```
