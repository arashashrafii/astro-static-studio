name: CI Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install && node scripts/link-workspaces.mjs

      - name: Typecheck
        run: npm run check

      - name: Build site and offline admin bundle
        run: npm run build

      - name: Verify Capacitor sync
        run: npx cap sync

      - name: Run unit tests
        run: node --import tsx --test tests/admin-draft.test.ts tests/analytics-search.test.ts tests/atelier-adapter.test.ts tests/backup.test.ts tests/build-output.test.ts tests/collection-mapping-poc.test.ts tests/content-v2-contract.test.ts tests/projects-route.test.ts tests/pwa.test.ts tests/site-setup.test.ts tests/store.test.ts tests/theme-settings.test.ts

      - name: Verify npm package tarball
        run: npm pack --dry-run
