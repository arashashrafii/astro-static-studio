pluginManagement {
    repositories {
        google()
        if (System.getProperty('offlineAstro.useGoogleMavenRedirector') == 'true') {
            maven {
                name = 'GoogleMavenRedirector'
                url = uri('https://redirector.gvt1.com/edgedl/android/maven2/')
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        if (System.getProperty('offlineAstro.useGoogleMavenRedirector') == 'true') {
            maven {
                name = 'GoogleMavenRedirector'
                url = uri('https://redirector.gvt1.com/edgedl/android/maven2/')
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'OfflineAstroAndroid'
include ':app'
