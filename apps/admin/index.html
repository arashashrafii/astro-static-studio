<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="مدیریت محتوا، صفحه‌ها، مجموعه‌ها و پیش‌نمایش محلی وب‌سایت — ۱۰۰٪ آفلاین" />
    <meta name="theme-color" content="#263c32" />
    <meta name="msapplication-TileColor" content="#263c32" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Astro Studio" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="preload" as="image" href="/icon.svg" />
    <title>Astro Static Studio | مدیریت محتوا</title>
    <style>
      .app-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#263c32;color:#f2f2db;text-align:center;font-family:system-ui,-apple-system,Tahoma,Arial,sans-serif}
      .app-splash-icon{width:96px;height:96px;border-radius:22px;box-shadow:0 16px 36px rgba(0,0,0,.28)}
      .app-splash-title{margin:0;font-family:Georgia,serif;font-style:italic;font-size:24px;font-weight:500;letter-spacing:.3px;color:#f2f2db;direction:ltr}
      .app-splash-subtitle{margin:0;font-size:13px;color:#c9d3c3}
      .app-splash-bar{width:136px;height:3px;border-radius:999px;background:rgba(242,242,219,.2);overflow:hidden;margin-top:4px}
      .app-splash-bar>span{display:block;width:45%;height:100%;border-radius:999px;background:#f2f2db;animation:splashSlide 1.2s ease-in-out infinite}
      @keyframes splashSlide{0%{transform:translateX(-110%)}100%{transform:translateX(230%)}}
      @media(prefers-reduced-motion:reduce){.app-splash-bar>span{animation:none;width:100%;opacity:.7}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash" role="status" aria-live="polite" aria-label="در حال بارگذاری Astro Static Studio">
        <img class="app-splash-icon" src="/icon.svg" alt="" width="96" height="96" decoding="sync" />
        <h1 class="app-splash-title">astro / studio</h1>
        <p class="app-splash-subtitle">در حال آماده‌سازی استودیو…</p>
        <div class="app-splash-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
