plugins {
    id 'com.android.application'
}

android {
    namespace 'org.astross.offlineastro'
    compileSdk 36

    defaultConfig {
        applicationId 'org.astross.offlineastro'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
}

def experimentRoot = layout.projectDirectory.dir('../..').asFile
tasks.register('prepareWebAssets', Exec) {
    workingDir experimentRoot
    commandLine 'npm', 'run', 'prepare:android'
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareWebAssets')
}
